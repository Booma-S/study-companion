[project]
name = "study-companion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "email-validator>=2.3.0",
    "fastapi>=0.138.2",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "rapidocr-onnxruntime>=1.4.4",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "wordninja>=2.0.0",
    "wordsegment>=1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

